aid: afterquery
name: AfterQuery
description: >-
  AfterQuery is a San Francisco applied research lab that curates expert reasoning data for
  frontier foundation models - supervised fine-tuning sets, rubric- and verifier-based
  reinforcement-learning environments, tool-calling and computer-use environments, RLHF, deep
  research tasks, multimodal data, and custom evaluation suites - produced with a network of
  verified professionals in finance, healthcare, law and software engineering through its
  AfterQuery Experts contributor platform. It publishes the IDE-Bench, App-Bench, Market-Bench,
  FinanceArena and FinanceQA benchmarks and sells data and evaluation engagements directly to AI
  labs and enterprises. AfterQuery ships no public product API: its only machine-callable surface
  is an anonymous documentation MCP server on its help-centre host, alongside an A2A agent card,
  a published agent skill and two llms.txt files.
