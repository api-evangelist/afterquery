apis:
- aid: afterquery:afterquery-experts-help-center-mcp
  name: AfterQuery Experts Help Center MCP
  description: >-
    A read-only Model Context Protocol server over the AfterQuery Experts Help Center, served
    anonymously from AfterQuery's documentation host. Three tools - full-text documentation search,
    a sandboxed read-only filesystem view of the help-centre pages, and documentation feedback
    submission - verified live by an unauthenticated tools/list on 2026-09-12. It is a
    documentation-platform surface generated by Mintlify, not an interface to AfterQuery's data,
    evaluation or research products, which have no public API.
