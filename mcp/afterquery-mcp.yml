name: AfterQuery Experts Help Center MCP
description: >-
  A read-only documentation MCP server over the AfterQuery Experts Help Center - full-text search
  across the help centre, a sandboxed read-only filesystem view of the documentation pages, and a
  feedback-submission tool. It is a documentation surface, not an interface to AfterQuery's
  training-data, evaluation or research products, which publish no API.
status: published
deployment:
  mode: remote
  endpoint: https://docs.afterquery.com/mcp
  auth: none
  verified: probed
  note: >-
    No install command and no package: nobody ships an AfterQuery stdio server. The hosted endpoint
    answers MCP JSON-RPC anonymously right now - an agent can call it without credentials.
    /.well-known/mcp.json names the canonical URL as
    https://afterqueryexperts.main-kill-isr.mintlify.me/mcp (the Mintlify project origin behind the
    custom domain) and declares authentication "none"; the same server answers on AfterQuery's own
    host at https://docs.afterquery.com/mcp, which is the URL recorded here because it is the one
    served from a domain AfterQuery controls.
  checked: '2026-09-12'
transport: streamable-http
