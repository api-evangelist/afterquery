tools:
  count: 3
  source: live tools/list response, saved verbatim alongside this manifest
  list:
  - name: search_after_query_experts_help_center
    title: Search documentation
    category: search
    input: {query: string (required)}
    read_only: true
    idempotent: true
  - name: query_docs_filesystem_after_query_experts_help_center
    title: Query docs filesystem
    category: retrieval
    input: {command: string (required)}
    read_only: true
    idempotent: true
    note: >-
      Runs a read-only shell-like command (rg, grep, find, tree, ls, cat, head, tail, jq and other
      text utilities) against an in-memory virtual filesystem holding only the help-centre pages.
      The advertised filesystem contains no api-reference directory - a `tree / -L 2` call on
      2026-09-12 returned only articles/{about,onboarding,payments-taxes}, data-policy.mdx,
      index.mdx and report-a-bug.mdx - which independently confirms AfterQuery publishes no API
      reference.
  - name: submit_feedback
    title: Submit documentation feedback
    category: feedback
    input: {path: string (required), feedback: string (required)}
    read_only: false
    idempotent: false
    note: The only non-read-only tool; it files a documentation problem report, it does not mutate any AfterQuery business object.
x-notes:
  platform_authored: >-
    This server is generated by Mintlify for AfterQuery's documentation project rather than
    hand-built by AfterQuery. Recorded as published because it is real, anonymous, callable and
    served from AfterQuery's own host - but it is a docs-platform surface and the tool names carry
    the Mintlify project suffix.
  no_product_api: >-
    Probed on 2026-09-12 and found nothing else: no OpenAPI at www.afterquery.com,
    docs.afterquery.com or api.afterquery.com; no GraphQL endpoint; no developer portal. The
